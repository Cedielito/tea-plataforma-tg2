name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas y compilación
    runs-on: ubuntu-latest

    env:
      # Binario de mongod que usa mongodb-memory-server en las pruebas del
      # repositorio. Se fija para que la caché sea estable entre corridas.
      MONGOMS_VERSION: 8.2.6
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Caché del binario de mongod
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mongodb-binaries
          key: mongod-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del backend con umbral de cobertura (70 %)
        run: npm run test:cov

      - name: Compilar el frontend
        run: npm run build:web
