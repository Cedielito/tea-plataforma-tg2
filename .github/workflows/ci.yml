name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas del backend con umbral de cobertura (70 %)
        run: npm run test:cov

      - name: Compilar el frontend
        run: npm run build:web
